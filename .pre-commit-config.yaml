default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: commit-message
        name: commit message is a Conventional Commit
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: translations
        name: every UI string exists in every language
        entry: python3 scripts/check_translations.py
        language: system
        pass_filenames: false
        files: ^matter_health/(translations|frontend|app)/
      - id: tests
        name: tests, types and coverage (Docker, Python 3.14)
        entry: scripts/run_tests.sh
        language: system
        pass_filenames: false
        files: ^(matter_health/app/|tests/|pyproject\.toml)
