configuration:
  retention_days:
    name: Conservar el historial (días)
    description: Cuánto tiempo se guardan los eventos y los hallazgos. Los problemas de emparejamiento suelen notarse días después.
  log_level:
    name: Nivel de registro
    description: Cuánto escribe el complemento en su propio registro.
  matter_server_url:
    name: Dirección del servidor Matter
    description: Déjalo vacío para encontrar automáticamente el complemento Matter Server.
  otbr_url:
    name: Dirección del OpenThread Border Router
    description: Déjalo vacío para encontrar automáticamente el complemento OpenThread Border Router.
  unifi:
    name: Controlador UniFi
    description: "Opcional. Lee de un controlador UniFi si los puentes y puntos de acceso están conectados por cable o por Wi-Fi. No se cambia nada."
    fields:
      url:
        name: Dirección
        description: "Por ejemplo https://192.168.1.1 para una consola UniFi."
      api_key:
        name: Clave de API
        description: "En las consolas UniFi en Configuración → Control Plane → Integraciones. Si no, usuario y contraseña."
      username:
        name: Usuario
        description: "Una cuenta local; basta el rol de solo lectura."
      password:
        name: Contraseña
      site:
        name: Sitio
        description: "Dejar vacío para el sitio predeterminado."
      verify_ssl:
        name: Verificar certificado
        description: "Dejar desactivado si el controlador usa un certificado autofirmado."
