name: Matter Health
version: "0.1.0"
slug: matter_health
description: Explains why Matter and Thread devices misbehave, in words anyone can follow.
url: https://github.com/skjall/home-assistant-matter-health
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:heart-pulse
panel_title: Matter Health

# Reads the Matter Server and OpenThread Border Router add-on logs and their
# APIs. Reading another add-on's log needs the manager role; nothing here
# changes any add-on.
hassio_api: true
hassio_role: manager
homeassistant_api: true

options:
  retention_days: 30
  log_level: info
  unifi: {}
schema:
  retention_days: int(1,365)
  log_level: list(debug|info|warning|error)
  matter_server_url: url?
  otbr_url: url?
  # Optional: a UniFi Network controller, read to tell how border routers
  # and access points are connected to the home network.
  unifi:
    url: url?
    api_key: password?
    username: str?
    password: password?
    site: str?
    verify_ssl: bool?
