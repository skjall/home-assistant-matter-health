name: Matter Health
version: 0.2.0
slug: matter_health
description: Explains why Matter and Thread devices misbehave, in words anyone can follow.
url: https://github.com/skjall/home-assistant-matter-health
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:heart-pulse
panel_title: Matter Health
hassio_api: true
hassio_role: manager
homeassistant_api: true
options:
  retention_days: 30
  log_level: info
schema:
  retention_days: int(1,365)
  log_level: list(debug|info|warning|error)
  matter_server_url: url?
  otbr_url: url?
